<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Excel Quiz Generator</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Generate interactive quizzes from Excel files offline on any device">
  <meta name="theme-color" content="#0284c7">
  
  <!-- iOS Safari PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Quiz Generator">
  <meta name="mobile-web-app-capable" content="yes">
  
  <!-- iOS Safari Icons -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="assets/icons/icon-192x192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/icon-192x192.png">
  <link rel="apple-touch-icon" sizes="167x167" href="assets/icons/icon-192x192.png">
</head>
<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to run Excel Quiz Generator offline.</noscript>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(function(reg) {
            console.log('PWA ServiceWorker registered successfully for iOS/Android:', reg.scope);
          })
          .catch(function(err) {
            navigator.serviceWorker.register('/ngsw-worker.js', { scope: '/' });
          });
      });
    }
  </script>
</body>
</html>
